<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Casper Cast Receiver</title>
  <!-- Cast Application Framework (CAF) receiver SDK.
       NOTE: do NOT add crossorigin="anonymous" here — gstatic won't serve this script under
       CORS on the Chromecast, and the browser then refuses the load, leaving cast.framework
       undefined (proven on-device, r4). We surface real error messages by catching SDK calls
       in our own same-origin try/catch instead (see init below). -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee;
                 font-family: monospace; overflow: hidden; }
    cast-media-player { position: absolute; inset: 0; }
    /* On-screen log overlay — so the TV itself shows what happened (no chrome://inspect needed). */
    /* Hidden by default (r9): the sender's Now Playing toggle shows it via {showLog:true}.
       Lines are still collected while hidden, so toggling on reveals the full history. */
    #log { display: none; position: absolute; left: 0; right: 0; bottom: 0; max-height: 55%;
           overflow: hidden; padding: 12px 16px; font-size: 20px; line-height: 1.35;
           background: rgba(0,0,0,0.72); white-space: pre-wrap; word-break: break-all; }
    .err  { color: #ff6b6b; }
    .ok   { color: #6bff9c; }
    .warn { color: #ffd36b; }
    .dim  { color: #9aa; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="log"></div>
  <script>
    // Bump this on every deploy so the on-screen log tells you which receiver the TV
    // actually loaded — GitHub Pages caching means "I pushed it" isn't "it's live".
    var RECEIVER_BUILD = 'r18 (video render watchdog)';

    // Declared up here (not beside the listener below) because log mirroring starts with the
    // very first boot line, long before the SDK wiring runs.
    var DEBUG_NAMESPACE = 'urn:x-cast:com.hebberd.castkit.debug';

    var logEl = document.getElementById('log');
    var lines = [];
    // Lines worth having no matter how long the receiver has been up: the codec probe is
    // logged once at boot, and with a 20-line ring it had always rotated away by the time a
    // sender attached and asked to replay — so "what does this TV actually decode?" was
    // never answerable from the phone, which is half of every cast diagnosis.
    var pinned = [];
    // The codec probe as structured data, resent whenever a sender attaches — it is the basis
    // for the sender's routing decisions, so it must survive the sender connecting late.
    var caps = null;
    /** Last status line logged, so MEDIA_STATUS records transitions rather than every tick. */
    var lastStatusLine = null;
    function sendCaps() {
      if (!caps || typeof ctx === 'undefined' || !ctx) return;
      try { ctx.sendCustomMessage(DEBUG_NAMESPACE, undefined, { caps: caps }); } catch (e) { }
    }
    // Lines not yet delivered to the sender. Everything the receiver knows — the codec probe,
    // the LOAD interception, and above all the ERROR event's reason/detailedErrorCode — used to
    // exist ONLY as text painted on the TV, unreachable from the phone exactly when a failed
    // cast made it worth reading. Mirroring the same log over the debug channel puts it in the
    // phone's cast trace, where it survives the session ending.
    var pending = [];
    var started = false;
    function mirror(l) {
      pending.push(l);
      if (pending.length > 120) pending.shift();
      flush();
    }
    function flush() {
      if (!started || typeof ctx === 'undefined' || !ctx) return;
      try {
        while (pending.length) {
          // undefined senderId = broadcast to every connected sender.
          ctx.sendCustomMessage(DEBUG_NAMESPACE, undefined, { log: pending[0] });
          pending.shift();   // only drops once the send didn't throw
        }
      } catch (e) { /* no sender attached yet — keep them buffered and retry */ }
    }
    function log(msg, cls) {
      var t = (Math.round(performance.now()) / 1000).toFixed(2);
      var line = { t: t, msg: String(msg), cls: cls || '' };
      lines.push(line);
      if (lines.length > 120) lines.shift();
      logEl.innerHTML = lines.map(function (l) {
        return '<div class="' + l.cls + '">' + l.t + '  ' +
          String(l.msg).replace(/</g, '&lt;') + '</div>';
      }).join('');
      // eslint-disable-next-line no-console
      console.log('CASPER ' + msg);
      try { mirror(line); } catch (e) { /* logging must never break playback */ }
    }

    // Register failure handlers FIRST, before touching the CAF SDK. If the framework
    // script failed to load, the very next line throws — and without these already in
    // place the TV just sits on a black screen with a spinner and no clue why, while the
    // sender hangs in "connecting" forever. With them, any such failure paints red here.
    window.addEventListener('error', function (e) {
      var where = e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : '';
      log('JS ERROR ' + (e.message || e) + where, 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      log('PROMISE REJECT ' + ((e.reason && e.reason.message) || e.reason || e), 'err');
    });
    log('boot ' + RECEIVER_BUILD, 'ok');

    // Guard the SDK handle: a failed framework load becomes a plain on-screen message
    // instead of a silent throw. This is the single most common "stuck on black + spinner"
    // cause, and previously it left no trace at all.
    if (typeof cast === 'undefined' || !cast.framework) {
      log('FATAL: CAF framework did not load (cast.framework undefined) — check the ' +
          "receiver device's network access to gstatic.com", 'err');
      throw new Error('CAF framework unavailable');
    }

    // Wrap all SDK init so a throw from the cross-origin framework is CAUGHT here, in our
    // same-origin code, with its real message + stack. An UNCAUGHT cross-origin throw only
    // reaches window.onerror as the useless "Script error." (that was r3). This is the fix
    // for that opacity that doesn't break the SDK load the way crossorigin did.
    try {
    var ctx = cast.framework.CastReceiverContext.getInstance();
    var pm = ctx.getPlayerManager();

    // What can this specific TV actually decode? Probe before any cast so the log shows
    // the device's real codec support — the thing the sender has to match. When a cast
    // later fails, this table up top is the first place to look: sender codec vs. what
    // the hardware here admits it can play. Container+codec strings mirror what a remux
    // or HLS segmenter would hand the receiver.
    function probeCodecs() {
      if (typeof ctx.canDisplayType !== 'function') {
        log('canDisplayType unavailable — cannot probe codecs', 'warn');
        return;
      }
      // Profile and level, not just the codec family. "HEVC" alone is close to meaningless:
      // the old list asked only about hev1.1.6.L93.B0 — Main profile, level 3.1, 8-bit — and
      // answered "decodes: HEVC" for a device that then refused a 1080p Main10 L4 file. Every
      // 1080p x265 release is in the bottom half of this list, so the exact row that says no
      // IS the diagnosis. Level numbers are 30x: L93=3.1, L120=4.0, L123=4.1, L150=5.0.
      var probes = [
        ['H.264/High@4.0',   'video/mp4',  'avc1.640028'],
        ['H.264/High@4.1',   'video/mp4',  'avc1.640029'],
        ['H.264/High@5.1',   'video/mp4',  'avc1.640033'],
        ['HEVC/Main@3.1',    'video/mp4',  'hev1.1.6.L93.B0'],
        ['HEVC/Main@4.0',    'video/mp4',  'hvc1.1.6.L120.B0'],
        ['HEVC/Main@4.1',    'video/mp4',  'hvc1.1.6.L123.B0'],
        ['HEVC/Main10@4.0',  'video/mp4',  'hvc1.2.4.L120.B0'],
        ['HEVC/Main10@4.1',  'video/mp4',  'hvc1.2.4.L123.B0'],
        ['HEVC/Main10@5.0',  'video/mp4',  'hvc1.2.4.L150.B0'],
        ['HEVC/Main10@4.0(hev1)', 'video/mp4', 'hev1.2.4.L120.B0'],
        ['VP9',    'video/webm', 'vp9'],
        ['AV1',    'video/mp4',  'av01.0.05M.08'],
        ['AAC',    'audio/mp4',  'mp4a.40.2'],
        ['AC-3',   'audio/mp4',  'ac-3'],
        ['E-AC-3', 'audio/mp4',  'ec-3'],
        ['FLAC',   'audio/mp4',  'fLaC'],
        ['Opus',   'audio/webm', 'opus']
      ];
      var yes = [], no = [], results = {};
      probes.forEach(function (p) {
        var ok = false;
        try { ok = ctx.canDisplayType(p[1], p[2]); } catch (e) { ok = false; }
        results[p[0]] = ok;
        (ok ? yes : no).push(p[0]);
      });
      log('decodes: ' + (yes.join(' ') || '(none)'), 'ok');
      log('rejects: ' + (no.join(' ') || '(none)'), no.length ? 'warn' : 'dim');
      // The same answers as structured data. The sender has to make routing decisions from
      // this (hev1 needs repackaging for one Chromecast on this network and not for another),
      // and scraping them out of a log line would be both fragile and too late.
      caps = {};
      probes.forEach(function (p) { caps[p[0]] = results[p[0]]; });
      sendCaps();
      // Pinned: this is the answer to "can this TV play that codec at all", and a sender
      // that attaches an hour after boot needs it as much as one that attaches at once.
      pinned = lines.slice(-2);
    }

    // ---- idle lifetime (see opts.disableIdleTimeout at the bottom) --------------------
    // Ours to enforce now, and the one thing it must do differently from the SDK's version:
    // treat a prep ping as activity. A remux or convert can run for many minutes with
    // nothing loaded here, and that wait is the sender working, not the TV being abandoned.
    // Without a ping for IDLE_GRACE_MS the app still gives the screen back, so a sender that
    // crashes or walks away doesn't strand the TV on a black receiver forever.
    var IDLE_GRACE_MS = 5 * 60 * 1000;
    var IDLE_CHECK_MS = 15 * 1000;
    var lastActivity = Date.now();
    function touchIdle() { lastActivity = Date.now(); }

    function idleCheck() {
      try {
        // Any state but IDLE is playing, paused or loading — all of them are activity.
        // Enum values are strings; fall back to the literal if this SDK build lacks it.
        var idle = (cast.framework.messages && cast.framework.messages.PlayerState &&
                    cast.framework.messages.PlayerState.IDLE) || 'IDLE';
        var state = (typeof pm.getPlayerState === 'function') ? pm.getPlayerState() : null;
        if (state && state !== idle) { touchIdle(); return; }
        var quiet = Date.now() - lastActivity;
        if (quiet >= IDLE_GRACE_MS) {
          log('idle ' + Math.round(quiet / 1000) + 's with no playback and no prep ping — ' +
              'shutting down', 'warn');
          ctx.stop();
        }
      } catch (e) { /* a watchdog must never be the thing that breaks playback */ }
    }

    // ---- video render watchdog -------------------------------------------------------
    // "PLAYING" means the media element's clock is advancing, and AUDIO ALONE advances it. A
    // receiver that is decoding no video — sound playing while the TV sits on its own home
    // screen — reports itself perfectly healthy, and every diagnostic we have believes it: the
    // trace shows BUFFERING → PLAYING, no error, and a load that reads as a success. Nothing on
    // either side of the wire could tell that case from a working cast. The decoder's own frame
    // counter can, so watch that instead of the player state.
    var RENDER_CHECK_MS = 2000;
    var RENDER_GRACE_MS = 10000;   // decoding starts after the first buffer; don't cry early
    var renderPrevTime = -1;       // media clock at the previous check
    var renderSince = 0;           // when the clock started advancing without interruption
    var renderBaseFrames = -1;     // decoded-frame count when that run started
    var renderReported = false;

    function videoElement() {
      try { return document.getElementsByTagName('video')[0] || null; } catch (e) { return null; }
    }

    /** Frames the decoder has produced, or -1 when this build won't say. */
    function decodedFrames(v) {
      try {
        if (typeof v.getVideoPlaybackQuality === 'function') {
          var q = v.getVideoPlaybackQuality();
          if (q && typeof q.totalVideoFrames === 'number') return q.totalVideoFrames;
        }
      } catch (e) { }
      return (typeof v.webkitDecodedFrameCount === 'number') ? v.webkitDecodedFrameCount : -1;
    }

    function renderCheck() {
      try {
        if (renderReported) return;
        var v = videoElement();
        if (!v) return;
        // Only meaningful for media that is supposed to have a picture at all.
        var info = (typeof pm.getMediaInformation === 'function' && pm.getMediaInformation()) || {};
        if (info.contentType && info.contentType.indexOf('video/') !== 0) return;

        var t = v.currentTime;
        var advancing = (renderPrevTime >= 0 && t > renderPrevTime + 0.1);
        renderPrevTime = t;
        // Paused, buffering or stalled is not the condition we're looking for — only a clock
        // that is genuinely running says "this is playing" loudly enough to be worth doubting.
        if (!advancing) { renderSince = 0; return; }
        var frames = decodedFrames(v);
        if (!renderSince) { renderSince = Date.now(); renderBaseFrames = frames; return; }
        if (Date.now() - renderSince < RENDER_GRACE_MS) return;

        var noSize = (v.videoWidth === 0 || v.videoHeight === 0);
        var noFrames = (frames >= 0 && renderBaseFrames >= 0 && frames === renderBaseFrames);
        // A build that reports neither dimensions nor frame counts stays quiet rather than
        // guessing — a false "no video" would be worse than the silence it replaces.
        if (!noSize && !noFrames) return;
        renderReported = true;
        log('AUDIO ONLY: the media clock is advancing (' + t.toFixed(1) + 's) but ' +
            (noSize ? 'the video track has no dimensions' : 'the decoder produced no new frames') +
            ' — ' + v.videoWidth + 'x' + v.videoHeight + ' frames=' + frames +
            '. Sound is playing with no picture.', 'err');
        try {
          ctx.sendCustomMessage(DEBUG_NAMESPACE, undefined, {
            render: {
              video: false, width: v.videoWidth, height: v.videoHeight,
              frames: frames, mediaTime: Math.round(t)
            }
          });
        } catch (e) { }
      } catch (e) { /* a watchdog must never be the thing that breaks playback */ }
    }

    // Surface what the sender actually asks us to load — including declared codecs, so a
    // sender/receiver codec mismatch is visible without decoding a single frame.
    pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, function (req) {
      // Re-arm the render watchdog: a new load gets its own verdict.
      renderReported = false; renderPrevTime = -1; renderSince = 0; renderBaseFrames = -1;
      try {
        var m = req.media || {};
        var tracks = m.tracks || [];
        log('LOAD id=' + m.contentId +
            ' type=' + m.contentType +
            ' stream=' + m.streamType +
            ' dur=' + (m.duration != null ? m.duration + 's' : '?') +
            ' start=' + (req.currentTime != null ? req.currentTime + 's' : '0') +
            ' codecs=' + (m.customData && m.customData.codecs || '?') +
            ' tracks=' + tracks.length);
        tracks.forEach(function (tr) {
          log('  track#' + tr.trackId + ' ' + tr.type + '/' + tr.subtype +
              ' ' + (tr.trackContentType || '') + ' ' + (tr.language || ''), 'dim');
        });
      } catch (e) { log('LOAD (unparsable): ' + e, 'warn'); }
      return req;
    });

    // Register a player-manager listener by EventType *name*, tolerating names this SDK
    // build doesn't define. A bad constant is `undefined`, and addEventListener(undefined)
    // THROWS — which previously aborted the whole receiver before ctx.start() and left it
    // dead on a black screen. Now an unknown name is skipped with a warning, so one wrong
    // enum can't take the receiver down, and the log names exactly which one to fix.
    function on(name, handler) {
      var type = cast.framework.events.EventType[name];
      if (type === undefined) {
        log('skip listener: EventType.' + name + ' not defined in this SDK', 'warn');
        return;
      }
      pm.addEventListener(type, handler);
    }

    // Player state transitions — this is what "buffering forever" would show.
    on('PLAYER_STATE_CHANGED', function (e) {
      if (e.playerState !== 'IDLE') touchIdle();
      log('state=' + e.playerState, e.playerState === 'PLAYING' ? 'ok' : '');
    });
    on('MEDIA_STATUS', function (e) {
      var s = e.mediaStatus || {};
      // Belt and braces for [idleCheck]: this fires throughout playback, so even an SDK
      // build without getPlayerState can't have the watchdog stop a playing video. Only a
      // NON-idle state counts, or a status repeated while idle would defeat the timeout.
      if (s.playerState && s.playerState !== 'IDLE') touchIdle();
      // Log CHANGES only. MEDIA_STATUS fires continuously — a paused video emits it several
      // times a second — and since the log ring grew to 120 lines (r14, so the codec probe
      // would survive to be replayed) that meant every replay dumped a hundred identical
      // "status=PAUSED" lines into the sender's cast trace, burying the boot probe, the LOAD
      // and the error it exists to show. The state transitions are the diagnostic; the
      // repeats are noise.
      if (s.playerState) {
        var line = 'status=' + s.playerState + (s.idleReason ? ' idle=' + s.idleReason : '');
        if (line !== lastStatusLine) {
          lastStatusLine = line;
          log(line, s.idleReason && s.idleReason !== 'FINISHED' ? 'warn' : '');
        }
      }
    });
    on('BUFFERING', function (e) {
      log('buffering=' + e.isBuffering, e.isBuffering ? 'dim' : '');
    });

    // Once media loads, report what the receiver actually committed to. Read the player
    // manager's own media information — the event's mediaInformation field is often absent
    // or sparse, which previously printed a misleading "type=undefined dur=?" even when the
    // load carried a full MediaInfo.
    on('MEDIA_INFORMATION_CHANGED', function (e) {
      try {
        var info = pm.getMediaInformation() || e.mediaInformation || {};
        var hls = info.hlsSegmentFormat || info.hlsVideoSegmentFormat;
        log('media: type=' + info.contentType +
            (hls ? ' hls=' + hls : '') +
            ' dur=' + (info.duration != null ? info.duration.toFixed(1) + 's' : '?'), 'dim');
      } catch (e2) { /* best-effort */ }
    });

    // Numeric detailedErrorCode → the documented meaning. These were previously commented
    // as "104 SEGMENT_NETWORK, 110 MEDIA_SRC_NOT_SUPPORTED, 314 MEDIA_DECODE" — all three
    // wrong, and 104 is the one that actually turns up. A code read as a network fault when
    // it means "the media element cannot play this source" sends the diagnosis to the wrong
    // side of the wire, which is exactly what happened: six minutes of re-encoding spent on
    // a file whose codec was never the objection.
    var ERROR_NAMES = {
      100: 'MEDIA_UNKNOWN', 101: 'MEDIA_ABORTED', 102: 'MEDIA_DECODE',
      103: 'MEDIA_NETWORK', 104: 'MEDIA_SRC_NOT_SUPPORTED',
      110: 'SOURCE_BUFFER_FAILURE',
      201: 'MEDIAKEYS_NETWORK', 202: 'MEDIAKEYS_UNSUPPORTED', 203: 'MEDIAKEYS_WEBCRYPTO',
      300: 'NETWORK_UNKNOWN', 301: 'SEGMENT_NETWORK',
      311: 'HLS_NETWORK_MASTER_PLAYLIST', 312: 'HLS_NETWORK_PLAYLIST',
      313: 'HLS_NETWORK_NO_KEY_RESPONSE', 314: 'HLS_NETWORK_KEY_LOAD',
      315: 'HLS_NETWORK_INVALID_SEGMENT', 316: 'HLS_SEGMENT_PARSING',
      321: 'DASH_NETWORK', 322: 'DASH_NO_INIT',
      331: 'SMOOTH_NETWORK', 332: 'SMOOTH_NO_MEDIA_DATA',
      411: 'HLS_MANIFEST_MASTER', 412: 'HLS_MANIFEST_PLAYLIST',
      421: 'DASH_MANIFEST_NO_PERIODS', 422: 'DASH_MANIFEST_NO_MIMETYPE',
      423: 'DASH_INVALID_SEGMENT_INFO', 431: 'SMOOTH_MANIFEST',
      900: 'APP', 901: 'BREAK_CLIP_LOADING_ERROR', 902: 'BREAK_SEEK_INTERCEPTOR_ERROR',
      903: 'IMAGE_ERROR', 904: 'LOAD_INTERRUPTED', 905: 'LOAD_FAILED',
      906: 'MEDIA_ERROR_MESSAGE', 909: 'GENERIC'
    };

    // The network codes are documented as carrying an appended network code and HTTP status
    // ({ErrorCode}{NetworkErrorCode}{HTTPStatusCode}), so a real failure can arrive as e.g.
    // 3010404 rather than 301. Decode the leading code and keep the tail — for a receiver
    // pulling from a phone over HTTP, the status on the end is often the whole story.
    function errorName(code) {
      if (ERROR_NAMES[code]) return ERROR_NAMES[code];
      var s = String(code);
      for (var len = 3; len <= 3 && s.length > len; len++) {
        var head = ERROR_NAMES[Number(s.slice(0, len))];
        if (head) return head + ' +' + s.slice(len);
      }
      return 'UNKNOWN';
    }
    // The prize: the actual failure. The numeric code is the only precise thing here, so it
    // is named in the line AND sent as a structured message the sender can reason about
    // instead of scraping this text.
    on('ERROR', function (e) {
      var code = e.detailedErrorCode;
      var name = errorName(code);
      log('ERROR ' + name + ' (' + code + ') reason=' + e.reason +
          (e.error ? ' error=' + JSON.stringify(e.error) : ''), 'err');
      try {
        ctx.sendCustomMessage(DEBUG_NAMESPACE, undefined,
          { err: { code: code, name: name, reason: String(e.reason) } });
      } catch (x) { /* the sender may already be gone */ }
    });

    // Let the Casper sender show/hide this on-screen log over a custom channel. Hidden by
    // default (r9); a {showLog:true} message reveals it with its collected history.
    // NOTE: must set an explicit 'block' — '' would fall back to the stylesheet's
    // display:none and the toggle could never show it.
    ctx.addCustomMessageListener(DEBUG_NAMESPACE, function (event) {
      try {
        var d = event.data || {};
        if (typeof d.showLog === 'boolean') {
          logEl.style.display = d.showLog ? 'block' : 'none';
          console.log('CASPER showLog=' + d.showLog);
        }
        // "The cast is still coming" — the sender pings this every 15s while it remuxes, which
        // can run for many minutes. Logged (and so timestamped on this side too) so a receiver
        // that goes away mid-preparation is provably distinguishable from one that never heard
        // from the sender again.
        if (typeof d.prep === 'string') { touchIdle(); log('sender: ' + d.prep, 'dim'); }
        // "Can you play THIS?" — the sender naming the actual contentType/codecs of the file
        // it is about to cast. A static table can only ever approximate; this asks the device
        // about the exact stream, and the answer comes back over the same channel.
        if (d.canPlay && typeof d.canPlay.codecs === 'string') {
          var ct = d.canPlay.contentType || 'video/mp4';
          var ok = false;
          try { ok = ctx.canDisplayType(ct, d.canPlay.codecs); } catch (e) { ok = false; }
          log('canDisplayType(' + ct + ', ' + d.canPlay.codecs + ') = ' + ok,
              ok ? 'ok' : 'err');
          try {
            ctx.sendCustomMessage(DEBUG_NAMESPACE, undefined,
              { canPlayResult: { codecs: d.canPlay.codecs, contentType: ct, ok: ok } });
          } catch (x) { /* sender gone */ }
        }
        // A sender that attached late (the receiver boots, probes codecs and logs the load
        // before the app's session object exists) asks for the history it missed.
        if (d.replay === true) {
          sendCaps();
          pinned.forEach(function (l) { pending.push(l); });
          lines.forEach(function (l) { pending.push(l); });
          flush();
        }
      } catch (e) { /* a debug channel must never break playback */ }
    });

    var opts = new cast.framework.CastReceiverOptions();
    opts.maxInactivity = 3600;               // don't tear down while we debug
    // maxInactivity governs the SENDER CONNECTION, not this app's own life. The receiver
    // stops itself about five minutes after playback stops, and a custom message is not
    // playback — so a sender spending six minutes converting an HEVC file pinged us every
    // 15s and was torn down underneath it anyway (r12 trace: booted, never got playable
    // media, session gone 311s later mid-convert). disableIdleTimeout hands the decision to
    // us; idleCheck below is that timeout, reimplemented so a prep ping counts as activity.
    opts.disableIdleTimeout = true;
    opts.customNamespaces = { };
    opts.customNamespaces[DEBUG_NAMESPACE] = cast.framework.system.MessageType.JSON;
    log('receiver starting… ' + RECEIVER_BUILD, 'ok');
    probeCodecs();
    ctx.start(opts);
    started = true;
    setInterval(idleCheck, IDLE_CHECK_MS);
    setInterval(renderCheck, RENDER_CHECK_MS);
    // Anything logged during boot (codec probe included) goes out as soon as a sender attaches.
    try {
      ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, function () {
        flush(); sendCaps();
      });
    } catch (e) { log('sender-connected hook unavailable: ' + e, 'warn'); }
    setInterval(flush, 2000);   // safety net: nothing stays stuck in the buffer
    log('receiver started', 'ok');
    } catch (e) {
      log('INIT FAILED: ' + (e && e.message ? e.message : e), 'err');
      if (e && e.stack) {
        log('stack: ' + String(e.stack).split('\n').slice(0, 3).join('  |  '), 'err');
      }
    }
  </script>
</body>
</html>
